[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-aware-rl"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "pyqtgraph>=0.13",
    "PySide6>=6.6",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]